[project]
name = "embedding-serving-lab"
version = "0.1.0"
description = "A provider-portable lab for embedding serving experiments."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.30.0,<1",
]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.9,<1",
]

[project.scripts]
embedding-lab = "embedding_lab.cli.main:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_lab"]

[tool.uv.workspace]
members = ["services/*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests", "services"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "src",
    "tests",
    "services/model-server-simulator/src",
    "services/model-server-simulator/tests",
    "services/model-server/src",
    "services/model-server/tests",
    "services/gateway/src",
    "services/gateway/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "services"]
exclude = ['^\\.venv/']
