[project]
name = "model-simulator"
version = "0.1.0"
description = "A configurable embedding model simulator for gateway experiments."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
model-simulator = "model_simulator.main:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_simulator"]
