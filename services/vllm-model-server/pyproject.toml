[project]
name = "vllm-model-server"
version = "0.1.0"
description = "Configuration and Modal deployment for the real vLLM embedding server."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
modal = [
    "modal>=1.5.5,<2",
]

[project.scripts]
vllm-model-server-deploy = "vllm_model_server.cli:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_model_server"]
